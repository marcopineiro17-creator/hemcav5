<!-- ============================================================
     CATALOGO DE PROPIEDADES · CORPORATIVO PIÑEIRO-MEDINA  (v5)
     Rediseño completo. Pega TODO este bloque en un campo
     "Codigo personalizado" (HTML) de Hostinger.
     ------------------------------------------------------------
     POR QUE LA v4 SE SEGUIA VIENDO MAL  (medido, no supuesto)

     El tema de Hostinger PISABA los estilos. Sus reglas son del tipo
     `body .contenido button {...}` (especificidad 0,2,1) y las mias eran
     `.cpm-chip {...}` (0,1,0): gana el tema. Resultado medido sobre los
     controles: borde 0px, radio 0px, padding 0px, fondo transparente y
     tipografia Georgia. Las tarjetas se salvaban solo porque son <div>
     y el tema no estiliza divs. Por eso se veian tarjetas bonitas pero
     el buscador y los filtros "en crudo".

     EN ESTA VERSION
     1) TODAS las reglas van ancladas a #cpm-catalogo (o #cpm-portal para
        los modales). Los controles de formulario ademas llevan
        !important en las propiedades que los constructores siempre
        pisan. Es la unica forma fiable dentro de un tema ajeno.
     2) BARRA STICKY QUE NO SE ESCONDE. Antes se pegaba en top:0 y
        quedaba DEBAJO de la cabecera fija del sitio. Ahora se mide la
        cabecera fija en tiempo real y la barra se pega debajo de ella.
     3) DISEÑO NUEVO con la identidad CPM: navy #132a41, azul #3d7ab5,
        acento oro #c8a84b, tipografia Montserrat. Portada con logo,
        tarjetas con proporcion fija, marca de agua CPM cuando no hay
        foto, ficha rediseñada y esqueletos de carga.
     4) Se conserva de la v4: busqueda tolerante a errores, ficha
        centrada en pantalla aunque el bloque este en un iframe,
        desbloqueo del contenedor de Hostinger y cadena de respaldo.

     ------------------------------------------------------------
     ⚠ LAS FOTOS NO PUEDEN APARECER SIN CAMBIAR LAS REGLAS DE FIREBASE.
     Esto NO tiene arreglo por codigo. Comprobado: una lectura sin
     sesion a la coleccion 'terrenos' devuelve
         permission-denied :: Missing or insufficient permissions
     asi que el catalogo publico solo puede mostrar el respaldo
     incrustado aqui, que no trae fotos.

     Para que se vean fotos y datos reales, en la consola de Firebase >
     Firestore > Reglas, pega:

         match /terrenos/{id} {
           allow read, write: if request.auth != null;
         }
         match /catalogo_publico/{id} {
           allow read: if true;
           allow write: if request.auth != null;
         }

     y despues entra al portafolio de asesores y aprieta el boton
     "↻ Sincronizar catálogo". Eso llena 'catalogo_publico' con los
     campos publicos (sin comision ni comentarios).

     COMPROBAR QUE ESTA PEGADA ESTA VERSION: agrega ?cpmdebug=1 a la URL.
     Debe aparecer una franja amarilla que dice "CATALOGO v5".
     ============================================================ -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<div id="cpm-catalogo">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

/* ═══════════════════════════════════════════════════════════════
   IDENTIDAD CPM
   ═══════════════════════════════════════════════════════════════ */
#cpm-catalogo, #cpm-portal{
  --navy:#132a41;
  --navy2:#1d3f5f;
  --blue:#3d7ab5;
  --blue-d:#2d5f8f;
  --blue-l:#5a95cc;
  --pale:#e8f2fb;
  --gold:#b4912f;
  /* Oro metálico: un color plano se ve mostaza. El barrido de 6 paradas
     (sombra → luz → sombra) es lo que lo hace leer como metal. */
  --oro-sombra:#7a5c12;
  --oro-base:#b0892b;
  --oro-luz:#f2dd9e;
  --oro-grad:linear-gradient(135deg,#8f6d1a 0%,#c8a53f 18%,#f2dd9e 40%,#e0c46e 54%,#b0892b 76%,#8a681a 100%);
  --oro-grad-sutil:linear-gradient(135deg,#c9a63f 0%,#eeda98 45%,#b48f2c 100%);
  --paper:#f7f9fc;
  --line:#e4eaf1;
  --ink:#16283a;
  --ink2:#5a6a7a;
  --ink3:#93a2b3;
  --white:#fff;
  --ff:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:16px;
  --r-sm:10px;
  --sh:0 1px 2px rgba(19,42,65,.05), 0 6px 20px rgba(19,42,65,.06);
  --sh-h:0 10px 20px rgba(19,42,65,.10), 0 24px 48px rgba(19,42,65,.14);
  --topbar:0px;   /* alto de la cabecera fija del sitio; lo mide el JS */
}

/* ── Reset acotado ── */
#cpm-catalogo, #cpm-catalogo *, #cpm-catalogo *::before, #cpm-catalogo *::after,
#cpm-portal, #cpm-portal *, #cpm-portal *::before, #cpm-portal *::after{
  box-sizing:border-box; margin:0; padding:0;
}
#cpm-catalogo{
  font-family:var(--ff); background:var(--paper); color:var(--ink);
  width:100%; line-height:1.5; font-size:15px;
  -webkit-font-smoothing:antialiased;
}
#cpm-catalogo img{max-width:100%;display:block}
#cpm-catalogo svg{display:block}
#cpm-catalogo a{text-decoration:none;color:inherit}

/* ═══════════════════════════════════════════════════════════════
   RESET DURO DE CONTROLES
   Los temas de constructores traen reglas como
   `body .contenido button{...}` que ganan por especificidad a una
   sola clase. Anclar al id sube la especificidad, y el !important
   cubre los casos en que el tema tambien usa !important.
   Sin esto, el buscador y los filtros salen sin borde ni fondo.
   ═══════════════════════════════════════════════════════════════ */
#cpm-catalogo button.cpm-ctl,
#cpm-catalogo input.cpm-ctl,
#cpm-catalogo select.cpm-ctl{
  font-family:var(--ff) !important;
  font-weight:600 !important;
  line-height:1.25 !important;
  margin:0 !important;
  box-shadow:none !important;
  text-transform:none !important;
  letter-spacing:normal !important;
  text-shadow:none !important;
  min-height:0 !important;
  height:auto !important;
  -webkit-appearance:none !important;
  -moz-appearance:none !important;
  appearance:none !important;
  outline:none !important;
  cursor:pointer;
  display:inline-flex !important;
  align-items:center !important;
  transition:border-color .18s, background .18s, color .18s, box-shadow .18s;
}
#cpm-catalogo input.cpm-ctl{ cursor:text; display:block !important; }

/* La portada (logo + "Cartera de propiedades") se quito: el sitio ya
   tiene su propio encabezado y se veia repetido. */

/* ═══════════════════════════════════════════════════════════════
   BARRA DE FILTROS (sticky por debajo de la cabecera del sitio)
   ═══════════════════════════════════════════════════════════════ */
#cpm-catalogo .cpm-bar{
  position:sticky; top:var(--topbar); z-index:30;
  background:rgba(255,255,255,.92);
  -webkit-backdrop-filter:saturate(160%) blur(12px); backdrop-filter:saturate(160%) blur(12px);
  border-bottom:1px solid var(--line);
  box-shadow:0 6px 18px rgba(19,42,65,.05);
}
#cpm-catalogo .cpm-bar-in{
  width:100%; max-width:1240px; margin:0 auto; padding:14px clamp(16px,3vw,28px);
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
/* buscador */
#cpm-catalogo .cpm-find{ position:relative; flex:1 1 260px; min-width:0; }
#cpm-catalogo .cpm-find svg{
  position:absolute; left:15px; top:50%; margin-top:-9px;
  width:18px; height:18px; color:var(--ink3); pointer-events:none;
}
#cpm-catalogo input.cpm-search{
  width:100% !important;
  padding:12px 14px 12px 44px !important;
  border:1.5px solid var(--line) !important;
  border-radius:12px !important;
  background:var(--white) !important;
  color:var(--ink) !important;
  font-size:14px !important;
  font-weight:500 !important;
}
#cpm-catalogo input.cpm-search::placeholder{ color:var(--ink3); font-weight:400; opacity:1; }
#cpm-catalogo input.cpm-search:focus{
  border-color:var(--blue) !important;
  box-shadow:0 0 0 3px rgba(61,122,181,.15) !important;
}
/* control segmentado */
#cpm-catalogo .cpm-seg{
  display:inline-flex; padding:3px; gap:2px; background:var(--pale);
  border:1px solid #d7e6f6; border-radius:12px; flex:0 0 auto;
}
#cpm-catalogo button.cpm-tab{
  padding:8px 16px !important;
  border:0 !important;
  border-radius:9px !important;
  background:transparent !important;
  color:var(--blue-d) !important;
  font-size:12.5px !important;
  font-weight:700 !important;
  white-space:nowrap;
}
#cpm-catalogo button.cpm-tab:hover{ background:rgba(255,255,255,.7) !important; }
#cpm-catalogo button.cpm-tab.on{
  background:var(--navy) !important; color:#fff !important;
  box-shadow:0 3px 10px rgba(19,42,65,.28) !important;
}
/* select de ciudad */
#cpm-catalogo .cpm-city{ position:relative; flex:0 0 auto; }
#cpm-catalogo select.cpm-select{
  padding:11px 38px 11px 14px !important;
  border:1.5px solid var(--line) !important;
  border-radius:12px !important;
  background:var(--white) !important;
  color:var(--ink2) !important;
  font-size:13px !important;
  font-weight:600 !important;
  min-width:190px;
}
#cpm-catalogo select.cpm-select:focus{ border-color:var(--blue) !important; }
#cpm-catalogo .cpm-city::after{
  content:''; position:absolute; right:15px; top:50%; margin-top:-3px;
  width:8px; height:8px; border-right:2px solid var(--ink2); border-bottom:2px solid var(--ink2);
  transform:rotate(45deg); pointer-events:none;
}
#cpm-catalogo .cpm-total{
  margin-left:auto; font-size:12.5px; color:var(--ink2); font-weight:600; white-space:nowrap;
}
#cpm-catalogo .cpm-total b{ color:var(--navy); font-weight:800; }
/* aviso de busqueda aproximada */
#cpm-catalogo .cpm-hint{
  flex:1 1 100%; display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  background:var(--pale); border:1px solid #cfe3f6; border-radius:11px;
  padding:9px 14px; font-size:13px; color:var(--blue-d); font-weight:500;
}
#cpm-catalogo .cpm-hint svg{ width:16px; height:16px; flex:0 0 16px; }
#cpm-catalogo .cpm-hint b{ font-weight:800; }

/* ═══════════════════════════════════════════════════════════════
   REJILLA Y TARJETAS
   ═══════════════════════════════════════════════════════════════ */
#cpm-catalogo .cpm-body{ width:100%; max-width:1240px; margin:0 auto; padding:clamp(20px,3vw,30px) clamp(16px,3vw,28px) clamp(36px,5vw,56px); }
#cpm-catalogo .cpm-grid{
  display:grid; gap:clamp(14px,1.6vw,22px);
  grid-template-columns:repeat(auto-fill, minmax(250px,1fr));
}
#cpm-catalogo .cpm-grid > *{ min-width:0; }

#cpm-catalogo .cpm-card{
  background:var(--white); border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; cursor:pointer; box-shadow:var(--sh);
  display:flex; flex-direction:column;
  transition:transform .22s cubic-bezier(.2,.8,.3,1), box-shadow .22s, border-color .22s;
}
#cpm-catalogo .cpm-card:hover{ transform:translateY(-5px); box-shadow:var(--sh-h); border-color:#cfe0f2; }
#cpm-catalogo .cpm-thumb{
  position:relative; aspect-ratio:4/3; overflow:hidden;
  background:linear-gradient(150deg,#eaf3fc 0%,#d3e4f6 100%);
}
#cpm-catalogo .cpm-thumb img.cpm-photo{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  transition:transform .5s cubic-bezier(.2,.8,.3,1);
}
#cpm-catalogo .cpm-card:hover .cpm-thumb img.cpm-photo{ transform:scale(1.05); }
/* Marca de agua CPM cuando la propiedad no tiene foto: se ve intencional,
   no como una imagen rota. */
#cpm-catalogo .cpm-wm{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
}
#cpm-catalogo .cpm-wm img{ width:46%; max-width:120px; height:auto; opacity:.30; }
#cpm-catalogo .cpm-wm::after{
  content:''; position:absolute; inset:0;
  background:repeating-linear-gradient(135deg, rgba(255,255,255,.35) 0 2px, transparent 2px 9px);
  opacity:.5;
}
#cpm-catalogo .cpm-tag{
  position:absolute; top:11px; left:11px; z-index:2;
  background:rgba(19,42,65,.9); color:#fff;
  font-size:9.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
  padding:5px 11px; border-radius:7px;
}
#cpm-catalogo .cpm-tag.macro{ background:rgba(200,168,75,.95); color:#2b2205; }
#cpm-catalogo .cpm-nfoto{
  position:absolute; bottom:10px; right:10px; z-index:2;
  background:rgba(19,42,65,.75); color:#fff; border-radius:7px;
  padding:4px 9px; font-size:11px; font-weight:700; display:flex; align-items:center; gap:5px;
}
#cpm-catalogo .cpm-nfoto svg{ width:12px; height:12px; }

#cpm-catalogo .cpm-info{ padding:14px 16px 16px; display:flex; flex-direction:column; flex:1; }
#cpm-catalogo .cpm-ref{
  font-size:10px; font-weight:700; letter-spacing:.16em; color:var(--blue);
  text-transform:uppercase; margin-bottom:6px;
}
#cpm-catalogo .cpm-title{
  font-size:15px; font-weight:700; color:var(--navy); line-height:1.3;
  letter-spacing:-.01em; margin-bottom:7px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
#cpm-catalogo .cpm-place{
  font-size:12.5px; color:var(--ink2); font-weight:500;
  display:flex; align-items:center; gap:6px; margin-bottom:14px;
}
#cpm-catalogo .cpm-place svg{ width:13px; height:13px; flex:0 0 13px; color:var(--blue-l); }
#cpm-catalogo .cpm-place span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* flex-wrap en vez de un breakpoint: en tarjetas angostas el precio y el
   chip de superficie no caben lado a lado (necesitan ~166px en un pie de
   125px) y quedaban apretados. Asi el chip baja solo cuando hace falta. */
#cpm-catalogo .cpm-foot{
  margin-top:auto; padding-top:13px; border-top:1px solid var(--line);
  display:flex; align-items:baseline; justify-content:space-between;
  gap:4px 10px; flex-wrap:wrap;
}
#cpm-catalogo .cpm-price{ font-size:17px; font-weight:800; color:var(--navy); letter-spacing:-.02em; }
#cpm-catalogo .cpm-size{
  font-size:11.5px; font-weight:700; color:var(--blue-d);
  background:var(--pale); padding:4px 10px; border-radius:7px; white-space:nowrap;
}

/* ═══════════════════════════════════════════════════════════════
   TARJETA PREMIUM (Imperio Conkal)
   Mismo tamaño y distribución que las demás; solo cambia el
   tratamiento: borde dorado, banderín y capas informativas.
   ═══════════════════════════════════════════════════════════════ */
/* Borde metálico de verdad: el degradado va en el border-box y el
   relleno en el padding-box. Un `border: 2px solid oro` se ve plano. */
#cpm-catalogo .cpm-card.premium{
  border:2px solid transparent;
  background:
    linear-gradient(180deg,#fffdf6 0%,var(--white) 46%) padding-box,
    var(--oro-grad) border-box;
  box-shadow:0 1px 3px rgba(122,92,18,.16), 0 14px 34px rgba(19,42,65,.13);
}
#cpm-catalogo .cpm-card.premium:hover{
  box-shadow:0 6px 16px rgba(122,92,18,.24), 0 26px 54px rgba(19,42,65,.20);
}
/* banderín superior derecho */
#cpm-catalogo .cpm-flag{
  position:absolute; top:11px; right:11px; z-index:3;
  background:var(--oro-grad); color:#3a2c06;
  font-size:8.5px; font-weight:800; letter-spacing:.14em;
  text-transform:uppercase; padding:5px 11px; border-radius:6px;
  box-shadow:0 2px 8px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.55);
  text-shadow:0 1px 0 rgba(255,255,255,.35);
}
/* capas informativas sobre la foto */
#cpm-catalogo .cpm-layers{
  position:absolute; left:10px; right:10px; bottom:10px; z-index:3;
  display:flex; gap:5px; flex-wrap:wrap;
}
#cpm-catalogo .cpm-layer{
  background:rgba(10,22,36,.82); color:#f2dd9e;
  border:1px solid rgba(226,199,120,.42);
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  font-size:8.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  padding:4px 8px; border-radius:5px; white-space:nowrap;
}
#cpm-catalogo .cpm-layer.hot{
  background:var(--oro-grad-sutil); color:#3a2c06; border-color:rgba(122,92,18,.5);
  text-shadow:0 1px 0 rgba(255,255,255,.3);
}
/* degradado para que las capas se lean sobre cualquier foto */
#cpm-catalogo .cpm-card.premium .cpm-thumb::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:52%;
  background:linear-gradient(to top, rgba(9,20,32,.72), rgba(9,20,32,0));
  pointer-events:none; z-index:2;
}
#cpm-catalogo .cpm-card.premium .cpm-ref{ color:#9a7d28; }
#cpm-catalogo .cpm-card.premium .cpm-foot{ border-top-color:rgba(200,168,75,.42); }
#cpm-catalogo .cpm-desde{
  display:block; font-size:9.5px; font-weight:800; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink3); margin-bottom:1px;
}
/* botón dentro de la tarjeta */
#cpm-catalogo a.cpm-cta-card{
  display:flex; align-items:center; justify-content:center; gap:7px;
  margin-top:12px; padding:12px; border-radius:10px;
  background:var(--oro-grad); color:#3a2c06;
  font-size:11.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  text-shadow:0 1px 0 rgba(255,255,255,.35);
  box-shadow:0 3px 10px rgba(122,92,18,.3), inset 0 1px 0 rgba(255,255,255,.6), inset 0 -1px 0 rgba(88,66,12,.35);
  transition:transform .18s, box-shadow .18s, filter .18s;
}
#cpm-catalogo a.cpm-cta-card:hover{
  transform:translateY(-2px); filter:saturate(1.08) brightness(1.04);
  box-shadow:0 8px 18px rgba(122,92,18,.42), inset 0 1px 0 rgba(255,255,255,.6);
}
#cpm-catalogo a.cpm-cta-card svg{ width:14px; height:14px; }

/* ── Ficha premium ── */
#cpm-portal .cpm-sheet.premium{
  border:2px solid transparent;
  background:linear-gradient(#fff,#fff) padding-box, var(--oro-grad) border-box;
}
#cpm-portal .cpm-sheet.premium .cpm-head{
  background:linear-gradient(135deg,#0f2437,#20456a);
  border-bottom:0; position:relative;
}
/* filo metálico bajo la cabecera */
#cpm-portal .cpm-sheet.premium .cpm-head::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--oro-grad);
}
#cpm-portal .cpm-sheet.premium .cpm-head .k{
  background:var(--oro-grad-sutil); color:#3a2c06; text-shadow:0 1px 0 rgba(255,255,255,.3);
}
#cpm-portal .cpm-layers-sheet{ display:flex; gap:7px; flex-wrap:wrap; margin-bottom:16px; }
#cpm-portal .cpm-layer-b{
  background:#fdf8ea; border:1px solid rgba(180,145,47,.45); color:#6d5410;
  font-size:10px; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
  padding:7px 12px; border-radius:8px;
}
#cpm-portal .cpm-layer-b.hot{
  background:var(--oro-grad-sutil); color:#3a2c06; border-color:rgba(122,92,18,.45);
  text-shadow:0 1px 0 rgba(255,255,255,.3);
}
#cpm-portal .cpm-acciones{ display:grid; gap:9px; }
#cpm-portal a.cpm-btn-oro{
  display:flex; align-items:center; justify-content:center; gap:10px;
  background:var(--oro-grad); color:#3a2c06;
  border-radius:13px; padding:15px; font-size:13.5px; font-weight:800;
  letter-spacing:.06em; text-transform:uppercase;
  text-shadow:0 1px 0 rgba(255,255,255,.35);
  box-shadow:0 6px 18px rgba(122,92,18,.32), inset 0 1px 0 rgba(255,255,255,.6), inset 0 -1px 0 rgba(88,66,12,.35);
  transition:transform .18s, box-shadow .18s, filter .18s;
}
#cpm-portal a.cpm-btn-oro:hover{
  transform:translateY(-2px); filter:saturate(1.08) brightness(1.04);
  box-shadow:0 12px 26px rgba(122,92,18,.44), inset 0 1px 0 rgba(255,255,255,.6);
}
#cpm-portal a.cpm-btn-navy{
  display:flex; align-items:center; justify-content:center; gap:10px;
  background:var(--navy); color:#fff; border-radius:13px; padding:14px;
  font-size:13px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  transition:background .18s;
}
#cpm-portal a.cpm-btn-navy:hover{ background:var(--navy2); }
#cpm-portal a.cpm-btn-oro svg,#cpm-portal a.cpm-btn-navy svg{ width:17px; height:17px; }

/* ── Esqueletos de carga ── */
#cpm-catalogo .cpm-sk{ background:var(--white); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
#cpm-catalogo .cpm-sk .a{ aspect-ratio:4/3; }
#cpm-catalogo .cpm-sk .b{ height:13px; margin:16px 16px 0; border-radius:5px; }
#cpm-catalogo .cpm-sk .c{ height:13px; margin:10px 60px 22px 16px; border-radius:5px; }
#cpm-catalogo .cpm-sk .a,#cpm-catalogo .cpm-sk .b,#cpm-catalogo .cpm-sk .c{
  background:linear-gradient(90deg,#eef3f8 25%,#e2eaf3 37%,#eef3f8 63%);
  background-size:400% 100%; animation:cpmSk 1.3s ease infinite;

/* Alto de la cabecera FIJA del sitio, para que la barra sticky no
   se esconda debajo de ella. Se busca el elemento fijo mas alto
   pegado al borde superior de la ventana. */
var CABECERA=0;   /* alto de la cabecera fija del sitio, en px */
/* Se mide en el documento del SITIO, no en el del bloque. Antes se miraba
   document.body, que dentro del iframe es el del propio bloque: ahi no hay
   ninguna cabecera fija, asi que el valor era siempre 0. Por eso la barra de
   filtros se escondia debajo de la cabecera y, sobre todo, por eso la ficha
   se abria con su boton de cerrar tapado. */
function ventanaSitio(){
  try{ if(FRAME && FRAME.win) return FRAME.win; }catch(e){}
  return window;
}
function documentoSitio(){
  try{ var w=ventanaSitio(); if(w && w.document) return w.document; }catch(e){}
  return document;
}
function medirCabecera(){
  var alto=0;
  try{
    var w=ventanaSitio(), doc=documentoSitio();
    var nodos=doc.body ? doc.body.children : [];
    var anchoVentana=w.innerWidth||window.innerWidth||360;
    for(var i=0;i<nodos.length;i++){
      var e=nodos[i];
      if(e===root || e===portal || (e.contains && e.contains(root))) continue;
      var cs=w.getComputedStyle ? w.getComputedStyle(e) : getComputedStyle(e);
      if(cs.position!=='fixed' && cs.position!=='sticky') continue;
      if(cs.display==='none' || cs.visibility==='hidden') continue;
      var r=e.getBoundingClientRect();
      if(r.top<=2 && r.bottom>alto && r.bottom<260 && r.width>anchoVentana*0.5) alto=r.bottom;
    }
  }catch(e){}
  CABECERA=Math.round(alto);
  /* El desplazamiento de la barra sticky SOLO se aplica fuera de un iframe.
     Dentro, el documento del bloque no hace scroll propio, asi que
     position:sticky no puede pegarse a nada: lo unico que consigue top es
     bajar la barra 64px y taparle 34px a la primera fila de tarjetas.
     Medido: barra acabando en 137px y tarjetas empezando en 103px.
     CABECERA se sigue usando para anclar la ficha, que es donde hace falta. */
  var desfase = 0;
  try{ desfase = (FRAME && FRAME.el) ? 0 : CABECERA; }catch(e){ desfase = 0; }
  root.style.setProperty('--topbar', desfase+'px');
}
function bleed(){
  root.style.width=''; root.style.marginLeft=''; root.style.marginRight='';
  var vw=document.documentElement.clientWidth;
  var r=root.getBoundingClientRect(), w0=r.width, left=r.left;
  if(vw<=w0+1) return;
  root.style.marginLeft=(-left)+'px';
  root.style.width=vw+'px';
  root.style.marginRight=(w0-vw+left)+'px';
}

function banda(){
  if(!FRAME.el) return null;
  try{
    var r=FRAME.el.getBoundingClientRect(), ph=FRAME.win.innerHeight;
    var bot=Math.min(r.height, ph-r.top);
    /* La banda empieza DEBAJO de la cabecera fija del sitio. Si empezara en
       el borde de la ventana, la cabecera de la ficha -- que es donde vive el
       boton de cerrar -- quedaria tapada por ella y no habria forma de cerrar
       la tarjeta. Medido en movil: el boton caia entre 7 y 41px y la cabecera
       del sitio ocupa los primeros 64. */
    var top=Math.max(0, CABECERA-r.top);

       se prefiere mostrarla entera aunque roce la cabecera. */
    if(bot-top<300) top=Math.max(0,-r.top);
    return {top:top, height:Math.max(220,bot-top)};

/* ─────────────────────────────────────────────────────────
   ESPACIO EN BLANCO AL FILTRAR
   Hostinger fija el alto del iframe con el contenido que había al
   cargar. Al filtrar, la rejilla encoge pero el iframe conserva su
   alto y queda un hueco enorme antes del pie de página. Como el
   iframe es del mismo origen, aquí se le ajusta el alto al contenido
   real y se desbloquea su contenedor en la página padre.
   ───────────────────────────────────────────────────────── */
function aplicarAlto(){
  if(!FRAME.el) return;
  try{
    var alto=Math.ceil(root.getBoundingClientRect().height);
    if(alto<40) return;
    var actual=parseFloat(FRAME.el.style.height)||0;
    if(Math.abs(actual-alto)>2){          /* umbral: evita reescrituras inútiles */
      FRAME.el.style.height=alto+'px';
      FRAME.el.style.minHeight='0';
    }
    colapsarContenedores(FRAME.el);
  }catch(e){}
}
/* ─────────────────────────────────────────────────────────
   COLAPSAR LA ALTURA RESERVADA POR EL CONSTRUCTOR
   Hostinger mide el bloque una vez y guarda esa altura en los contenedores
   del iframe. Al filtrar, el iframe encoge pero la reserva se queda: de ahi
   el hueco en blanco antes del pie. Medido: iframe 772px, seccion 5182px,
   4410px de blanco.
   Dos cosas hay que hacer, y antes no se hacia ninguna:
     · escribir con !important, porque la reserva del constructor tambien lo
       lleva y sin prioridad no se le gana;
     · poner grid-template-rows:auto en .block-layout, que es una fila de
       rejilla de alto fijo -- el min-height de la seccion por si solo no
       explica el hueco, la fila si.
   Es el mismo tratamiento que el codigo global de CPM aplica a los bloques
   que si reconoce (aqui el id no esta en su lista).
   ───────────────────────────────────────────────────────── */
function colapsarContenedores(marco){
  var el=marco.parentElement, n=0;
  while(el && el.tagName!=='BODY' && n<8){
    var s=el.style, cl=' '+(el.className||'')+' ';
    s.setProperty('height','auto','important');
    s.setProperty('min-height','0','important');
    s.setProperty('max-height','none','important');
    s.overflow='visible';
    /* La fila de rejilla: se fuerza en .block-layout y en cualquier
       contenedor que este maquetando como rejilla. */
    var esRejilla=false;
    try{ esRejilla=getComputedStyle(el).display.indexOf('grid')>=0; }catch(e){}
    if(esRejilla || cl.indexOf(' block-layout ')>=0){
      s.setProperty('grid-template-rows','auto','important');
    }
    /* El relleno de abajo solo se quita en los contenedores propios del
       bloque de codigo; en el resto podria ser separacion legitima. */
    if(/ (grid-embed|layout-element|block-layout|block) /.test(cl)){
      s.setProperty('margin-bottom','0','important');
      s.setProperty('padding-bottom','0','important');
    }
    el=el.parentElement; n++;
  }
}

     acabamos de cambiar dispara el bucle que el navegador suprime, y
     entonces la corrección nunca llega. */
  aplicarAlto();

/* Rango de diacriticos U+0300..U+036F por codigo numerico. Escribirlo con
   caracteres literales lo corrompe si la pagina no se sirve como UTF-8 y
   lanza "Range out of order in character class", que tumba todo el script. */
var RE_DIA=new RegExp('['+String.fromCharCode(0x300)+'-'+String.fromCharCode(0x36F)+']','g');
function norm(s){
  s=String(s==null?'':s).toLowerCase();
  try{ s=s.normalize('NFD').replace(RE_DIA,''); }catch(e){}
  return s.replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
function lev(a,b,max){
  if(a===b) return 0;
  var la=a.length, lb=b.length;
  if(Math.abs(la-lb)>max) return max+1;
  if(!la) return lb; if(!lb) return la;
  var prev=new Array(lb+1), cur=new Array(lb+1), i, j;
  for(j=0;j<=lb;j++) prev[j]=j;
  for(i=1;i<=la;i++){
    cur[0]=i; var best=cur[0];
    for(j=1;j<=lb;j++){
      var cost=(a.charCodeAt(i-1)===b.charCodeAt(j-1))?0:1;
      var v=prev[j]+1;
      if(cur[j-1]+1<v) v=cur[j-1]+1;
      if(prev[j-1]+cost<v) v=prev[j-1]+cost;
      cur[j]=v; if(v<best) best=v;
    }
    if(best>max) return max+1;
    var t=prev; prev=cur; cur=t;
  }
  return prev[lb];
}
function tol(n){ return n<=3?0 : n<=5?1 : n<=8?2 : 3; }
function indexar(t){

  for(var i=0;i<parts.length;i++){ var p=parts[i]; if(p.length>=3 && !vistos[p]){ vistos[p]=1; toks.push(p); } }

}
var VOCAB=[];
function vocab(){
  var peso={}, bonito={};
  DATA.forEach(function(t){
    [t.ciudad,t.estado,t.tipo].forEach(function(v){
      norm(v).split(' ').forEach(function(w){ if(w.length>=4) peso[w]=(peso[w]||0)+3; });
    });
    (t._toks||[]).forEach(function(w){ if(w.length>=4) peso[w]=(peso[w]||0)+1; });
    [t.ciudad,t.estado,t.nombre,t.descripcion].forEach(function(v){
      String(v||'').split(/[\s,.;:()]+/).forEach(function(w){
        var k=norm(w); if(k.length>=4 && !bonito[k]) bonito[k]=w;
      });

function scoreTok(tk,t){
  if(t._txt.indexOf(tk)>=0) return 0;
  var tt=tol(tk.length), mejor=-1;
  for(var i=0;i<t._toks.length;i++){
    var w=t._toks[i];
    if(w.indexOf(tk)===0) return 0.4;
    if(w.length>tk.length && tk.length>=4){
      var dp=lev(tk,w.substr(0,tk.length),tt);
      if(dp<=tt && (mejor<0 || 0.5+dp<mejor)) mejor=0.5+dp;
    }
    if(Math.abs(w.length-tk.length)<=tt){
      var d=lev(tk,w,tt);
      if(d<=tt && (mejor<0 || d<mejor)) mejor=d;
      if(mejor===0) break;
    }
  }
  return mejor<0 ? -1 : (mejor||0.2);
}
function sugerir(tk){
  var tt=tol(tk.length)+1, mejor=null, mejorD=99;
  for(var i=0;i<VOCAB.length;i++){
    var v=VOCAB[i], d=99;
    if(Math.abs(v.k.length-tk.length)<=tt) d=lev(tk,v.k,tt);
    if(v.k.length>tk.length && tk.length>=4){
      var dp=lev(tk,v.k.substr(0,tk.length),tt);
      if(dp<d) d=dp;
    }
    if(d<mejorD || (d===mejorD && mejor && v.peso>mejor.peso)){ mejorD=d; mejor=v; }
    if(mejorD===0) break;

function buscar(qRaw, base){

    for(var i=0;i<toks.length;i++){ if(t._txt.indexOf(toks[i])<0) return false; }
    return true;
  });
  if(estricto.length) return {lista:estricto,aprox:false,sug:[]};
  var pts=[];
  base.forEach(function(t){
    var total=0;
    for(var i=0;i<toks.length;i++){ var v=scoreTok(toks[i],t); if(v<0) return; total+=v; }
    pts.push({t:t,s:total});

    pts.sort(function(a,b){ return a.s-b.s || String(a.t.id).localeCompare(String(b.t.id)); });

}

  }else{ hint.style.display='none'; hint.innerHTML=''; }

  if(!res.lista.length){
    var s='';
    if(res.sug.length){
      s='<p>¿Quizá quisiste decir…?</p><div class="cpm-sugs">'+
        res.sug.map(function(x){ return '<button type="button" class="cpm-ctl cpm-sug" data-s="'+esc(x)+'">'+esc(x)+'</button>'; }).join('')+'</div>';
    }else{ s='<p>Prueba con otra ciudad o palabra clave</p>'; }
    grid.innerHTML='<div class="cpm-none">'+LUPA+'<b>Sin resultados</b>'+s+'</div>';
    Array.prototype.forEach.call(grid.querySelectorAll('.cpm-sug'),function(b){
      b.addEventListener('click',function(){ $('cpmQ').value=b.getAttribute('data-s'); filtrar(); $('cpmQ').focus(); });
    });
    return;
  }
  /* La destacada siempre encabeza, sin importar el orden que traiga
     el filtro o el puntaje de la búsqueda aproximada. */
  var lista=res.lista.slice().sort(function(a,b){ return (b._premium?1:0)-(a._premium?1:0); });
  var frag=document.createDocumentFragment();
  lista.forEach(function(t){ frag.appendChild(tarjeta(t)); });
  grid.innerHTML='';
  grid.appendChild(frag);
  ajustarIframe();
}
function tarjeta(t){
  var d=document.createElement('div');
  d.className='cpm-card'+(t._premium?' premium':'');
  d.addEventListener('click',function(){ abrir(t); });
  var hay=t.fotos && t.fotos.length>0;
  var macro=(t.tipo==='Macrolote');
  var etiqueta = t._premium ? (t._etiqueta||t.tipo) : (macro?'Macrolote':'Terreno');
  var img = hay
    ? '<img class="cpm-photo" src="'+esc(t.fotos[0])+'" alt="'+esc(t.nombre)+'" loading="lazy"><div class="cpm-wm" style="display:none"><img src="'+esc(CFG.logoAzul)+'" alt=""></div>'
    : '<div class="cpm-wm"><img src="'+esc(CFG.logoAzul)+'" alt=""></div>';

  /* capas informativas solo en la tarjeta destacada */
  var capas='';
  if(t._premium && t._capas && t._capas.length){
    capas='<div class="cpm-layers">'+t._capas.slice(0,2).map(function(c){
      return '<span class="cpm-layer'+(c.hot?' hot':'')+'">'+esc(c.tc||c.t)+'</span>';
    }).join('')+'</div>';
  }
  var flag = (t._premium && t._flag) ? '<span class="cpm-flag">'+esc(t._flag)+'</span>' : '';
  var precio = (t._desde?'<span class="cpm-desde">Desde</span>':'')+money(t.precio);
  var cta = (t._premium && t._ctaCard)
    ? '<a class="cpm-cta-card" href="'+esc(t._ctaCard.url)+'" target="_blank" rel="noopener">'+esc(t._ctaCard.txt)+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></a>'
    : '';

  d.innerHTML=
    '<div class="cpm-thumb">'+img+
      '<span class="cpm-tag'+(macro?' macro':'')+(t._premium?' macro':'')+'">'+esc(etiqueta)+'</span>'+
      flag+
      (hay&&t.fotos.length>1?'<span class="cpm-nfoto">'+CAM+t.fotos.length+'</span>':'')+
      capas+
    '</div>'+
    '<div class="cpm-info">'+
      '<div class="cpm-ref">'+esc(t.id)+'</div>'+
      '<div class="cpm-title">'+esc(t.nombre)+'</div>'+
      '<div class="cpm-place">'+PIN+'<span>'+esc(t.ciudad)+(t.estado?', '+esc(t.estado):'')+'</span></div>'+
      '<div class="cpm-foot"><span class="cpm-price">'+precio+'</span><span class="cpm-size">'+sup(t)+(t._desde?'+':'')+'</span></div>'+
      cta+
    '</div>';

  /* el botón de la tarjeta no debe abrir también la ficha */
  var b=d.querySelector('a.cpm-cta-card');
  if(b) b.addEventListener('click',function(e){ e.stopPropagation(); });

  var im=d.querySelector('img.cpm-photo');
  if(im) im.addEventListener('error',function(){
    im.style.display='none';
    var wm=d.querySelector('.cpm-wm'); if(wm) wm.style.display='flex';
  });
  return d;
}

/* ════ Ficha ════ */
function abrir(t){
  actual=t; gi=0;
  var hay=t.fotos && t.fotos.length>0;
  $('cpmMTipo').textContent=t.tipo;
  $('cpmMRef').textContent=t.id;
  $('cpmMName').textContent=t.nombre;
  $('cpmMLoc').innerHTML=PIN+'<span>'+esc(t.ciudad)+(t.estado?', '+esc(t.estado):'')+'</span>';
  $('cpmMPrice').textContent=money(t.precio);
  $('cpmM2Wrap').style.display = t.precio_m2>0 ? 'block':'none';
  if(t.precio_m2>0) $('cpmM2').textContent=money(t.precio_m2);

  var im=$('cpmGalImg'), wm=$('cpmGalWm');
  if(hay){
    wm.style.display='none'; im.src=t.fotos[0]; im.style.display='block';
    var multi=t.fotos.length>1;
    $('cpmGalNum').style.display=multi?'block':'none';
    $('cpmGalNum').textContent='1 / '+t.fotos.length;
    $('cpmGalPrev').style.display=multi?'flex':'none';
    $('cpmGalNext').style.display=multi?'flex':'none';
    $('cpmGal').style.cursor='zoom-in';
  }else{
    wm.style.display='flex'; im.style.display='none'; im.removeAttribute('src');
    $('cpmGalNum').style.display='none'; $('cpmGalPrev').style.display='none'; $('cpmGalNext').style.display='none';
    $('cpmGal').style.cursor='default';
  }

  var f=[];
  if(t.dimensiones_m2>0) f.push(['Superficie', t.dimensiones_m2.toLocaleString('es-MX')+' m²']);
  if(t.hectareas>0)      f.push(['Hectáreas', t.hectareas.toLocaleString('es-MX',{maximumFractionDigits:4})+' ha']);
  if(t.ciudad)           f.push(['Ciudad', t.ciudad]);
  if(t.estado)           f.push(['Estado', t.estado]);
  $('cpmFacts').innerHTML=f.map(function(p){
    return '<div class="cpm-fact"><div class="l">'+esc(p[0])+'</div><div class="v">'+esc(p[1])+'</div></div>';
  }).join('');
  $('cpmMDesc').textContent=t.descripcion||'Sin descripción disponible.';

  var mp=$('cpmMaps');
  if(t.ubicacion_maps && /^https?:\/\//.test(t.ubicacion_maps)){ mp.href=t.ubicacion_maps; mp.style.display='flex'; }
  else mp.style.display='none';

  var msg=encodeURIComponent(t._premium
    ? 'Hola, me interesa Imperio Conkal. Quiero información de disponibilidad y precios.'
    : 'Hola, me interesa información sobre la propiedad '+t.nombre+' ('+t.id+') en '+t.ciudad+', '+t.estado+'. Precio: '+money(t.precio)+'.');
  var waUrl='https://wa.me/'+CFG.whatsapp+'?text='+msg;

  /* ── Ficha destacada: capas + 3 botones en vez de los CTA normales ── */
  var sheet=$('cpmSheet'), capas=$('cpmLayers'), acc=$('cpmAcciones');
  sheet.classList.toggle('premium', !!t._premium);
  if(t._premium){
    capas.style.display='flex';
    capas.innerHTML=(t._capas||[]).map(function(c){
      return '<span class="cpm-layer-b'+(c.hot?' hot':'')+'">'+esc(c.t)+'</span>';
    }).join('');
    acc.style.display='grid';
    acc.innerHTML=(t._acciones||[]).map(function(a){
      var href=(a.url==='wa')?waUrl:a.url;
      var cls=(a.estilo==='oro')?'cpm-btn-oro':(a.estilo==='wa'?'cpm-wa':'cpm-btn-navy');
      return '<a class="'+cls+'" href="'+esc(href)+'" target="_blank" rel="noopener">'+ICO[a.ico||'info']+esc(a.txt)+'</a>';
    }).join('');
    $('cpmWa').style.display='none';
    $('cpmTel').style.display='none';
  }else{
    capas.style.display='none'; capas.innerHTML='';
    acc.style.display='none';   acc.innerHTML='';
    $('cpmWa').style.display='flex'; $('cpmWa').href=waUrl;
    $('cpmTel').style.display='flex'; $('cpmTel').href='tel:'+CFG.telefono.replace(/\s/g,'');
    $('cpmTelTxt').textContent=CFG.telefono;
  }

  $('cpmScroll').scrollTop=0;
  medirCabecera();          /* la ficha se ancla debajo de la cabecera del sitio */
  var ov=$('cpmOv'); ov.classList.add('on'); seguir(ov,true);
  document.body.style.overflow='hidden';
}
function cerrar(){
  var ov=$('cpmOv'); ov.classList.remove('on'); seguir(ov,false);
  if(!$('cpmLb').classList.contains('on')) document.body.style.overflow='';
}
function galNav(dir){
  if(!actual || !actual.fotos.length) return;
  gi=(gi+dir+actual.fotos.length)%actual.fotos.length;
  $('cpmGalImg').src=actual.fotos[gi];
  $('cpmGalNum').textContent=(gi+1)+' / '+actual.fotos.length;
}

/* ════ Visor ════ */
function abrirLb(){
  if(!actual || !actual.fotos.length) return;
  lfotos=actual.fotos; li=gi; pintarLb();
  var lb=$('cpmLb'); lb.classList.add('on'); seguir(lb,true);
}
function cerrarLb(){
  var lb=$('cpmLb'); lb.classList.remove('on'); seguir(lb,false);
  if(!$('cpmOv').classList.contains('on')) document.body.style.overflow='';
}
function lbNav(d){ li=(li+d+lfotos.length)%lfotos.length; pintarLb(); }
function pintarLb(){
  $('cpmLbImg').src=lfotos[li];
  var dots=$('cpmLbDots'); dots.innerHTML='';
  var multi=lfotos.length>1;
  if(multi) lfotos.forEach(function(_,i){
    var e=document.createElement('i'); if(i===li) e.className='on';
    e.addEventListener('click',function(){ li=i; pintarLb(); });
    dots.appendChild(e);
  });
  $('cpmLbP').style.display=multi?'flex':'none';
  $('cpmLbN').style.display=multi?'flex':'none';
}

/* ════ Eventos ════ */
$('cpmQ').addEventListener('input',filtrar);
$('cpmCity').addEventListener('change',filtrar);
$('cpmSeg').addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('.cpm-tab'):null; if(!b) return;
  tipoAct=b.getAttribute('data-t');
  Array.prototype.forEach.call(root.querySelectorAll('.cpm-tab'),function(x){ x.classList.toggle('on', x===b); });
  $('cpmCity').value='';
  filtrar();
});
$('cpmClose').addEventListener('click',cerrar);
$('cpmOv').addEventListener('click',function(e){ if(e.target===$('cpmOv')) cerrar(); });
$('cpmSheet').addEventListener('click',function(e){ e.stopPropagation(); });
$('cpmGal').addEventListener('click',abrirLb);
$('cpmGalPrev').addEventListener('click',function(e){ e.stopPropagation(); galNav(-1); });
$('cpmGalNext').addEventListener('click',function(e){ e.stopPropagation(); galNav(1); });
$('cpmGalImg').addEventListener('error',function(){
  $('cpmGalImg').style.display='none'; $('cpmGalWm').style.display='flex';
});
$('cpmLbX').addEventListener('click',cerrarLb);
$('cpmLbP').addEventListener('click',function(){ lbNav(-1); });
$('cpmLbN').addEventListener('click',function(){ lbNav(1); });
$('cpmLb').addEventListener('click',function(e){ if(e.target===$('cpmLb')||e.target.className==='cpm-lb-in') cerrarLb(); });
document.addEventListener('keydown',function(e){
  var lbOn=$('cpmLb').classList.contains('on');
  if(e.key==='Escape'){ if(lbOn) cerrarLb(); else if($('cpmOv').classList.contains('on')) cerrar(); }
  if(lbOn){ if(e.key==='ArrowLeft') lbNav(-1); if(e.key==='ArrowRight') lbNav(1); }
});
/* los logos de marca de agua */
$('cpmLogoGal').src=CFG.logoAzul;

/* Mover los modales al <body>: asi ningun contenedor de Hostinger con
   transform o overflow puede recortarlos. */
if(portal && portal.parentNode!==document.body) document.body.appendChild(portal);

/* ════ Pintar ════ */
function pintar(data,origen){
  /* Las fotos reales de Imperio Conkal viven en la carpeta imperio_conkal
     de Storage, y listar Storage exige sesión (el catálogo público no la
     tiene). El portafolio de asesores, que sí está autenticado, importa
     esa carpeta y guarda las URL en el documento "IMPERIO CONKAL" de
     catalogo_publico. Aquí se toman de ahí y ese documento se saca de la
     lista normal para que no salga dos veces. */
  var fotosImperio=null;
  data=data.filter(function(t){
    if(String(t.id||'').toUpperCase().replace(/[_\s-]+/g,' ').trim()==='IMPERIO CONKAL'){
      if(Array.isArray(t.fotos) && t.fotos.length) fotosImperio=t.fotos;
      return false;
    }
    return true;
  });
  var IMP = fotosImperio
    ? (function(){ var o={}; for(var k in IMPERIO) o[k]=IMPERIO[k]; o.fotos=fotosImperio; return o; })()
    : IMPERIO;

  DATA=data.map(function(t){
    return indexar({
      id:t.id, nombre:t.nombre||t.id||'Propiedad', tipo:t.tipo||'Terreno Particular',
      ciudad:t.ciudad||'', estado:t.estado||'', descripcion:t.descripcion||'',
      precio:n2(t.precio_total||t.precio),
      dimensiones_m2:n2(t.dimensiones_m2), hectareas:n2(t.hectareas), precio_m2:n2(t.precio_m2),
      ubicacion_maps:t.ubicacion_maps||'',
      fotos:Array.isArray(t.fotos)?t.fotos:[]
    });
  }).sort(function(a,b){ return String(a.id).localeCompare(String(b.id)); });
  /* La ficha destacada va al frente y no viene de Firestore.
     Se indexa igual para que también responda a búsqueda y filtros. */
  DATA.unshift(indexar(IMP));
  vocab(); ciudades(); filtrar(); liberar();
  if(DEBUG){
    var d=$('cpmDiag'); d.style.display='block';
    var conFoto=DATA.filter(function(t){ return t.fotos.length; }).length;
    var det=[];
    det.push('<b>'+esc(CFG.colPublica)+'</b>: '+esc(DIAG[CFG.colPublica]||'sin respuesta todavía'));
    det.push('<b>'+esc(CFG.colPrivada)+'</b>: '+esc(DIAG[CFG.colPrivada]||'no se intentó'));
    d.innerHTML='CATALOGO '+VERSION+' · origen: <b>'+esc(origen)+'</b> · '+DATA.length+
      ' propiedades · con foto: <b>'+conFoto+'</b> · iframe: '+(FRAME.el?'sí':'no')+
      '<br>Firestore → '+det.join(' &nbsp;|&nbsp; ');
  }
}

/* ════ Datos ════ */
function iniciar(){
  if(typeof firebase==='undefined' || !firebase.firestore){ return setTimeout(iniciar,150); }
  var db;
  try{
    if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(CFG.firebase);
    db=firebase.firestore();
  }catch(e){
    if(!listo){ listo=true; pintar(FALLBACK,'respaldo local (Firebase no inició)'); }
    return;
  }
  sub(CFG.colPublica, function(){
    sub(CFG.colPrivada, function(){
      if(!listo){ listo=true; pintar(FALLBACK,'respaldo local (Firestore sin acceso)'); }
    });
  });
  function sub(col, alFallar){
    var hecho=false;
    try{
      db.collection(col).onSnapshot(function(snap){
        var data=snap.docs.map(function(d){
          var o=d.data()||{};
          var x={}; for(var k in o) if(Object.prototype.hasOwnProperty.call(o,k)) x[k]=o[k];
          x.id=o.id||d.id; x.fotos=fotosDe(o);
          return x;
        });
        if(!data.length){
          /* OJO: llegar aqui significa que la REGLA SI DEJA LEER pero la
             coleccion esta vacia. Es un diagnostico muy distinto a
             permission-denied y por eso se distingue en la franja. */
          DIAG[col]='se puede leer pero está VACÍA (falta apretar «Sincronizar catálogo»)';
          if(!hecho){ hecho=true; console.warn('[CPM] "'+col+'" vacía.'); alFallar(); }
          return;
        }
        DIAG[col]='OK, '+data.length+' documentos';
        hecho=true; listo=true;
        console.log('[CPM '+VERSION+'] '+col+' OK — '+data.length+' documentos');
        pintar(data,'Firestore · '+col);
      },function(err){
        DIAG[col]=(err.code||'error')+(err.code==='permission-denied'?' (la regla de lectura NO está activa)':'');
        console.warn('[CPM] "'+col+'" ('+(err.code||'?')+'): '+err.message);
        if(!hecho){ hecho=true; alFallar(); }
      });
    }catch(e){ DIAG[col]='excepción: '+e.message; if(!hecho){ hecho=true; alFallar(); } }
  }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',iniciar);
else iniciar();

})();
