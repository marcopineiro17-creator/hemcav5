<!-- =====================================================================
     CPM · MAPA DE PROPIEDADES
     Bloque para el contenedor de codigo de Hostinger.
     Lee la coleccion publica 'catalogo_publico' de Firebase y pinta la
     cartera sobre un mapa navegable, con su lista sincronizada.
     Se pega tal cual: no lleva etiquetas de documento y todo su CSS esta
     acotado a #cpm-mapa (y a .cpm-mp-* para las capas).
     Generado por tools/mapa.py -- no editar a mano.
     ===================================================================== -->
<script>
/* Primera linea del bloque: fija --vh-real en la raiz del documento antes de
   que el CSS se aplique a nada. Las propiedades personalizadas se heredan, asi
   que el valor llega a todo el bloque. Sin esto, 100svh se evaluaria una vez
   contra el viewport del iframe -- que puede medir miles de pixeles -- y el
   anfitrion dimensionaria el iframe con ese valor inflado: de ahi la franja
   blanca interminable al final. */
(function () {
  var H = 0;
  try { H = (window.self !== window.top && window.parent.innerHeight) || window.innerHeight; }
  catch (e) { H = window.innerHeight; }
  if (H > 0) try { document.documentElement.style.setProperty('--vh-real', H + 'px'); } catch (e) {}
  /* Solo se reajusta ante cambios grandes (girar el telefono). Los pequenos
     -- la barra de direcciones al desplazarse -- se ignoran a proposito: si
     este valor se mueve, cambian las alturas, el anfitrion redimensiona el
     iframe y aparece el temblor. */
  function s() {
    var h = 0;
    try { h = (window.self !== window.top && window.parent.innerHeight) || window.innerHeight; }
    catch (e) { h = window.innerHeight; }
    if (h > 0 && Math.abs(h - H) > 80) {
      H = h;
      try { document.documentElement.style.setProperty('--vh-real', h + 'px'); } catch (e) {}
    }
  }
  window.addEventListener('resize', s, { passive: true });
  try { if (window.self !== window.top) window.parent.addEventListener('resize', s, { passive: true }); } catch (e) {}
})();
</script>
<style>
/* ===================================================================
   CPM · MAPA DE PROPIEDADES
   Todo el CSS va acotado a #cpm-mapa (y a .cpm-mp-ov para las capas que
   se inyectan en <body>, que no pueden heredar del contenedor).

   A diferencia de los otros bloques, este NO es un documento alto: es un
   panel de ALTURA FIJA. Un mapa necesita altura real para existir, y la
   lista tiene su propio scroll interno -- que dentro de un iframe si
   funciona, porque es un scroller del propio elemento. De paso desaparece
   el problema de la altura reservada por el constructor: el bloque siempre
   mide lo mismo.
   =================================================================== */
#cpm-mapa {
  --azul:#3d7ab5;
  --azul-osc:#2d5f8f;
  --navy:#1a2d42;
  --navy-2:#2d4a6e;

  --texto:#5a6a7a;

  --verde:#27ae60;
  --sans:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;

  /* Altura del CUERPO (lista + mapa). Dentro del iframe, --vh-real es la
     altura de la ventana de VERDAD -- la fija el guion de cabecera --, no la
     del marco, que mide miles de pixeles.

     y el pie: sin descontarlos el bloque salia ~200px mas alto que la
     pantalla y habia que hacer scroll para ver el mapa completo. */

  font-family:var(--sans);

  background:#fff;
  border:1px solid var(--linea);
  border-radius:16px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
#cpm-mapa *,#cpm-mapa *::before,#cpm-mapa *::after { box-sizing:border-box }

.cpm-mp-pin {

  box-shadow:0 2px 8px rgba(26,45,66,.3);white-space:nowrap;text-align:center;

@media (max-width:860px) {

  #cpm-mapa .cuerpo { grid-template-columns:1fr }
  #cpm-mapa .panel { border-right:0 }

  #cpm-mapa.ver-lista .mapa-wrap { display:none }

  #cpm-mapa .filtros { padding:10px 12px }
  #cpm-mapa .barra { padding:10px 12px }

  #cpm-mapa .filtros .fila:first-child {

  #cpm-mapa .limpiar { grid-column:1/-1;text-align:center;padding:2px }
  #cpm-mapa #cpmMpTipos {

    -webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;
  }
  #cpm-mapa #cpmMpTipos::-webkit-scrollbar { display:none }
  #cpm-mapa #cpmMpTipos .pill { flex:0 0 auto;padding:6px 12px;font-size:11.5px }
  #cpm-mapa .cbtn { padding:8px 11px }
  #cpm-mapa .cbtn .txt { display:none }
}

  /* Busca un plus code dentro de un texto cualquiera. */
  var RE_PLUS = /\b([23456789CFGHJMPQRVWX]{2,8}\+[23456789CFGHJMPQRVWX]{2,3})\b/i;
  function plusEnTexto(txt, refLat, refLng) {
    var m = String(txt || "").match(RE_PLUS);
    if (!m) return null;
    var a = olcRecupera(m[1], refLat, refLng);
    if (!a) return null;
    return valida(a.lat, a.lng);
  }

  /* 1. Campos explicitos. Se aceptan varios nombres porque el dato lo
        pueden haber capturado de formas distintas. */
  function coordsDeCampos(o) {
    var pares = [["lat", "lng"], ["lat", "lon"], ["latitud", "longitud"],
                 ["latitude", "longitude"]];
    for (var i = 0; i < pares.length; i++) {
      var v = valida(o[pares[i][0]], o[pares[i][1]]);
      if (v) return v;
    }
    var anid = [o.coords, o.coordenadas, o.geo, o.ubicacion, o.punto, o.latlng];
    for (var j = 0; j < anid.length; j++) {
      var c = anid[j];
      if (!c) continue;
      if (typeof c === "string") {
        var m = c.match(/(-?\d{1,3}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)/);
        if (m) { var v2 = valida(m[1], m[2]); if (v2) return v2; }
      } else if (typeof c === "object") {
        var v3 = valida(c.lat != null ? c.lat : c.latitude,
                        c.lng != null ? c.lng : (c.lon != null ? c.lon : c.longitude));
        if (v3) return v3;
        /* GeoPoint de Firestore */
        var v4 = valida(c._lat, c._long);
        if (v4) return v4;
      }
    }
    return null;
  }

  /* 2. Coordenadas dentro del enlace de Maps. Solo funciona con enlaces
        LARGOS; los cortos (maps.app.goo.gl) no las llevan. */
  function coordsDeUrl(url) {
    var u = String(url || "");
    if (!/^https?:/i.test(u)) return null;
    var pats = [
      /!3d(-?\d{1,3}\.\d+)!4d(-?\d{1,3}\.\d+)/,          /* .../data=!3d..!4d.. */
      /@(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/,               /* /@lat,lng,15z     */
      /[?&](?:q|query|ll|center|daddr|sll)=(-?\d{1,3}\.\d+)%2C(-?\d{1,3}\.\d+)/i,
      /[?&](?:q|query|ll|center|daddr|sll)=(-?\d{1,3}\.\d+),\s*(-?\d{1,3}\.\d+)/i,
      /\/(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)(?:[/?#]|$)/     /* .../20.9,-89.5   */
    ];
    for (var i = 0; i < pats.length; i++) {
      var m = u.match(pats[i]);
      if (m) { var v = valida(m[1], m[2]); if (v) return v; }
    }
    return null;
  }

  /* 3. Centroide de la localidad. */
  function coordsDeLocalidad(ciudad, estado) {
    var c = norm(ciudad);
    if (c && LOCALIDADES[c]) return LOCALIDADES[c];
    /* "merida, yucatan" / "col. x, merida" -> se prueban los trozos */
    if (c) {
      var partes = c.split(" ");
      for (var n = partes.length; n >= 1; n--) {
        for (var i = 0; i + n <= partes.length; i++) {
          var frag = partes.slice(i, i + n).join(" ");
          if (frag.length >= 4 && LOCALIDADES[frag]) return LOCALIDADES[frag];
        }
      }
    }
    var e = norm(estado);
    if (e && CENTRO_ESTADO[e]) return CENTRO_ESTADO[e];
    return null;
  }

  /* Dispersion determinista: varias propiedades de la misma localidad no
     pueden quedar exactamente en el mismo punto o se tapan entre si. Se
     reparten en espiral con el angulo dorado -- siempre igual para la
     misma propiedad, porque el indice sale del orden estable de la lista. */
  function dispersa(base, k) {
    if (!k) return [base[0], base[1]];
    var ang = k * 2.399963229728653;                  /* angulo dorado en rad */
    var rad = 0.0045 * Math.sqrt(k);                  /* ~500 m por unidad    */
    return [base[0] + rad * Math.sin(ang), base[1] + rad * Math.cos(ang) * 1.05];
  }

  /* Resuelve una propiedad. `usados` cuenta cuantas van ya en esa
     localidad, para la dispersion. */
  function resolver(t, usados) {
    var v = coordsDeCampos(t);
    if (v) return { lat: v[0], lng: v[1], precision: "exacta", fuente: "campo" };
    var base = coordsDeLocalidad(t.ciudad, t.estado);
    /* Plus code declarado en el documento. Si es corto, la localidad hace de
       referencia; sin localidad conocida no se puede recuperar. */
    var pc = t.plus_code || t.pluscode || t.codigo_plus || t.plus;
    if (pc) {
      var pv = plusEnTexto(pc, base ? base[0] : null, base ? base[1] : null);
      if (pv) return { lat: pv[0], lng: pv[1], precision: "exacta", fuente: "plus code" };
    }
    v = coordsDeUrl(t.ubicacion_maps);
    if (v) return { lat: v[0], lng: v[1], precision: "exacta", fuente: "enlace" };
    /* Algunos enlaces y descripciones traen el plus code escrito dentro. */
    var pt = plusEnTexto(t.ubicacion_maps, base ? base[0] : null, base ? base[1] : null);
    if (pt) return { lat: pt[0], lng: pt[1], precision: "exacta", fuente: "plus code" };
    if (base) {
      var clave = norm(t.ciudad) || norm(t.estado) || "?";
      var k = usados[clave] || 0;
      usados[clave] = k + 1;
      var p = dispersa(base, k);
      return { lat: p[0], lng: p[1], precision: "aproximada", fuente: "localidad" };
    }
    return null;
  }

  /* ===================================================================
     BUSQUEDA TOLERANTE
     Mismo criterio que el catalogo: primero coincidencia exacta; si no hay,
     se acepta parecido por distancia de edicion y se avisa de que el
     resultado es aproximado.
     =================================================================== */
  function lev(a, b, max) {
    if (a === b) return 0;
    var la = a.length, lb = b.length;
    if (Math.abs(la - lb) > max) return max + 1;
    if (!la) return lb;
    if (!lb) return la;
    var prev = [], cur = [], i, j;
    for (j = 0; j <= lb; j++) prev[j] = j;
    for (i = 1; i <= la; i++) {
      cur[0] = i;
      var best = cur[0];
      for (j = 1; j <= lb; j++) {
        var cost = (a.charCodeAt(i - 1) === b.charCodeAt(j - 1)) ? 0 : 1;
        var v = prev[j] + 1;
        if (cur[j - 1] + 1 < v) v = cur[j - 1] + 1;
        if (prev[j - 1] + cost < v) v = prev[j - 1] + cost;
        cur[j] = v;
        if (v < best) best = v;
      }
      if (best > max) return max + 1;
      var tmp = prev; prev = cur; cur = tmp;
    }
    return prev[lb];
  }
  function tol(n) { return n <= 3 ? 0 : n <= 5 ? 1 : n <= 8 ? 2 : 3; }
  function indexar(t) {
    var texto = norm([t.id, t.nombre, t.tipo, t.ciudad, t.estado, t.descripcion,
                      (t.categorias || []).join(" ")].join(" "));
    var vistos = {}, toks = [], parts = texto.split(" ");
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (p.length >= 3 && !vistos[p]) { vistos[p] = 1; toks.push(p); }
    }
    t._txt = texto; t._toks = toks;
    return t;
  }
  var VOCAB = [];
  function armarVocab(lista) {
    var peso = {}, bonito = {};
    lista.forEach(function (t) {
      [t.ciudad, t.estado, t.tipo].forEach(function (v) {
        norm(v).split(" ").forEach(function (w) { if (w.length >= 4) peso[w] = (peso[w] || 0) + 3; });
      });
      (t._toks || []).forEach(function (w) { if (w.length >= 4) peso[w] = (peso[w] || 0) + 1; });
      [t.ciudad, t.estado, t.nombre].forEach(function (v) {
        String(v || "").split(/[\s,.;:()]+/).forEach(function (w) {
          var k = norm(w);
          if (k.length >= 4 && !bonito[k]) bonito[k] = w;
        });
      });
    });
    VOCAB = Object.keys(peso).map(function (k) {
      return { k: k, peso: peso[k], txt: bonito[k] || k };
    }).sort(function (a, b) { return b.peso - a.peso; });
  }
  function scoreTok(tk, t) {
    if (t._txt.indexOf(tk) >= 0) return 0;
    var tt = tol(tk.length), mejor = -1;
    for (var i = 0; i < t._toks.length; i++) {
      var w = t._toks[i];
      if (w.indexOf(tk) === 0) return 0.4;
      if (w.length > tk.length && tk.length >= 4) {
        var dp = lev(tk, w.substr(0, tk.length), tt);
        if (dp <= tt && (mejor < 0 || 0.5 + dp < mejor)) mejor = 0.5 + dp;
      }
      if (Math.abs(w.length - tk.length) <= tt) {
        var d = lev(tk, w, tt);
        if (d <= tt && (mejor < 0 || d < mejor)) mejor = d;
        if (mejor === 0) break;
      }
    }
    return mejor < 0 ? -1 : (mejor || 0.2);
  }
  function sugerir(tk) {
    var tt = tol(tk.length) + 1, mejor = null, mejorD = 99;
    for (var i = 0; i < VOCAB.length; i++) {
      var v = VOCAB[i], d = 99;
      if (Math.abs(v.k.length - tk.length) <= tt) d = lev(tk, v.k, tt);
      if (v.k.length > tk.length && tk.length >= 4) {
        var dp = lev(tk, v.k.substr(0, tk.length), tt);
        if (dp < d) d = dp;
      }
      if (d < mejorD || (d === mejorD && mejor && v.peso > mejor.peso)) { mejorD = d; mejor = v; }
      if (mejorD === 0) break;
    }
    return (mejor && mejorD <= tt) ? mejor.txt : null;
  }
  function buscar(qRaw, base) {
    var s = norm(qRaw);
    if (!s) return { lista: base, aprox: false, sug: [] };
    var toks = s.split(" ").filter(function (x) { return x.length >= 2; });
    if (!toks.length) return { lista: base, aprox: false, sug: [] };
    var estricto = base.filter(function (t) {
      for (var i = 0; i < toks.length; i++) { if (t._txt.indexOf(toks[i]) < 0) return false; }
      return true;
    });
    if (estricto.length) return { lista: estricto, aprox: false, sug: [] };
    var pts = [];
    base.forEach(function (t) {
      var total = 0;
      for (var i = 0; i < toks.length; i++) {
        var v = scoreTok(toks[i], t);
        if (v < 0) return;
        total += v;
      }
      pts.push({ t: t, s: total });
    });
    if (pts.length) {
      pts.sort(function (a, b) { return a.s - b.s || String(a.t.id).localeCompare(String(b.t.id)); });
      return { lista: pts.map(function (x) { return x.t; }), aprox: true, sug: [] };
    }
    var sug = [];
    toks.forEach(function (tk) { var x = sugerir(tk); if (x && sug.indexOf(x) < 0) sug.push(x); });
    return { lista: [], aprox: false, sug: sug.slice(0, 3) };
  }

  /* ===================================================================
     AGRUPACION DE ALFILERES
     A poco zoom, varios alfileres se solapan y el mapa se vuelve ilegible.
     Se agrupan por celda de pixeles: la celda con dos o mas propiedades se
     dibuja como un circulo con el numero, y al pulsarlo se acerca.
     Se hace por PIXELES y no por grados porque un grado de longitud no mide
     lo mismo que uno de latitud, y por zoom porque lo que importa es lo que
     se solapa EN PANTALLA.
     =================================================================== */
  function agrupar(items, proyecta, celda) {
    celda = celda || 64;
    var cubos = {}, orden = [];
    items.forEach(function (it) {
      var p = proyecta(it.coord.lat, it.coord.lng);
      var cx = Math.floor(p.x / celda), cy = Math.floor(p.y / celda);
      var k = cx + ":" + cy;
      if (!cubos[k]) { cubos[k] = { items: [], sx: 0, sy: 0 }; orden.push(k); }
      cubos[k].items.push(it);
      cubos[k].sx += it.coord.lat;
      cubos[k].sy += it.coord.lng;
    });
    return orden.map(function (k) {
      var c = cubos[k], n = c.items.length;
      return {
        grupo: n > 1,
        n: n,
        items: c.items,
        lat: n > 1 ? c.sx / n : c.items[0].coord.lat,
        lng: n > 1 ? c.sy / n : c.items[0].coord.lng
      };
    });
  }

  /* ===================== CARGA DE RECURSOS ===================== */
  function unScript(urls, i) {
    return new Promise(function (res, rej) {
      if (i >= urls.length) { rej(new Error("no se pudo cargar " + urls[0])); return; }
      var s = document.createElement("script");
      s.src = urls[i]; s.async = false;
      if (urls[i].indexOf("gstatic.com") === -1) s.crossOrigin = "anonymous";
      s.onload = function () { res(); };
      s.onerror = function () { unScript(urls, i + 1).then(res, rej); };
      document.head.appendChild(s);
    });
  }
  function unaHoja(urls, i) {
    return new Promise(function (res) {
      if (i >= urls.length) { res(false); return; }
      var l = document.createElement("link");
      l.rel = "stylesheet"; l.href = urls[i];
      l.onload = function () { res(true); };
      l.onerror = function () { unaHoja(urls, i + 1).then(res); };
      document.head.appendChild(l);
    });
  }
  function cargar(urls) { return unScript(urls, 0); }

  /* ===================== ESTADO ===================== */
  var DATOS = [];            /* todas las propiedades, ya indexadas       */
  var VISTA = [];            /* las que pasan los filtros                */
  var tipoAct = "Todos", q = "", ciudadAct = "", precioAct = "", supAct = "";
  var limite = null;         /* recuadro del mapa cuando se busca "en esta area" */
  var selId = null;
  var mapa = null, capaPins = null, pinPorId = {}, leafletOk = false;
  /* Capa activa y las dos capas de teselas que la componen. */
  var capaAct = CAPA_POR_OMISION, tejaBase = null, tejaEncima = null;
  var edicion = false, usuarioEd = null;

  /* Ficha destacada. No vive en Firestore, igual que en el catalogo: se
     inyecta aqui y va primero. Sus fotos, si ya se importaron, llegan en el
     documento puente 'IMPERIO CONKAL'. */
  var IMPERIO = {
    id: "IMPERIO CONKAL",
    nombre: "Imperio Conkal · Residencial Privado",
    tipo: "Desarrollo",
    ciudad: "Conkal",
    estado: "Yucatan",

    precio: 3800000,
    dimensiones_m2: 240,
    hectareas: 0,
    precio_m2: 0,
    ubicacion_maps: "https://maps.app.goo.gl/NyWBRxtysDm8GLP48",
    /* Del Plus Code 3F9W+27F Conkal, Yucatan. El desarrollo no vive en
       Firestore, asi que sus coordenadas se escriben aqui: sin ellas el
       alfiler caia en el centro de Conkal, a 1,8 km. */
    lat: 21.067563,
    lng: -89.504328,
    estado_propiedad: "disponible",
    categorias: [],
    fotos: [
      "https://assets.zyrosite.com/5MikVliRfr5rWuzU/modelo-itzar-dK7EpnNkEStZxdVh.jpg",
      "https://assets.zyrosite.com/5MikVliRfr5rWuzU/modelo-akbal-148Mcmc4MjjK1mJe.jpg",
      "https://assets.zyrosite.com/5MikVliRfr5rWuzU/alberca_-V2QEoDO2LOwg1gUH.jpg"
    ],
    _premium: true,

    _acciones: [
      { txt: "Ver disponibilidad", url: "https://www.cpmempresarial.com/imperio-conkal-cotizador", estilo: "oro" },
      { txt: "Ver más información", url: "https://www.cpmempresarial.com/imperio-conkal", estilo: "navy" }
    ]
  };

  function fotosDe(o) {
    var f = o.fotos || o.imagenes || o.images || o.photos || [];
    if (typeof f === "string") f = f.split(/[,\n]/);
    if (!Array.isArray(f)) f = [];
    return f.filter(function (u) { return typeof u === "string" && /^https?:\/\//i.test(u.trim()); })
            .map(function (u) { return u.trim(); });
  }

  /* ===================== ARRANQUE ===================== */
  var mapaPedido = false;
  Promise.resolve()
    .then(function () { return cargar(CDN.app); })
    .then(function () { return cargar(CDN.fs); })
    .then(function () {
      if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
      return firebase.firestore().collection(COL).get();
    })
    .then(function (snap) {
      var docs = [];
      snap.forEach(function (d) {
        var o = d.data() || {};
        if (!o.id) o.id = d.id;
        docs.push(o);
      });
      /* El documento puente lleva SOLO las fotos de Imperio; se saca de la
         lista para que el desarrollo no aparezca dos veces. */
      var fotosImp = null;
      docs = docs.filter(function (o) {
        var idn = String(o.id || "").toUpperCase().replace(/[_\s-]+/g, " ").trim();
        if (idn === "IMPERIO CONKAL") {
          var f = fotosDe(o);
          if (f.length) fotosImp = f;
          return false;
        }
        return true;
      });
      if (fotosImp) IMPERIO.fotos = fotosImp;

      docs.sort(function (a, b) { return String(a.id).localeCompare(String(b.id), "es", { numeric: true }); });
      docs.unshift(IMPERIO);

      /* Coordenadas. El contador de dispersion se comparte para que dos
         propiedades de la misma localidad no caigan en el mismo punto. */
      var usados = {};
      DATOS = docs.map(function (o) {
        o.fotos = fotosDe(o);
        o.coord = resolver(o, usados);
        return indexar(o);
      });
      armarVocab(DATOS);
      montar();
      pedirMapa();
    })
    .catch(function (e) {
      try { if (window.console) console.warn("[CPM mapa]", e && (e.code || e.message)); } catch (_) {}
      montar();
      var p = $("cpmMpPanel");
      if (p) {
        p.innerHTML = '<div class="vacio"><div class="big">⚠️</div><b>No se pudo leer la cartera</b>' +
          '<p>Revisa la conexión y recarga la página. Si el problema sigue, comprueba que la ' +
          'colección <b>' + esc(COL) + '</b> tenga lectura pública en las reglas de Firestore.</p></div>';
      }
      var w = $("cpmMpWrap"); if (w) w.classList.add("caido");
      ajustarAlto();
    });

  function pedirMapa() {
    if (mapaPedido) return;
    mapaPedido = true;
    unaHoja(CDN.lcss, 0)
      .then(function () { return cargar(CDN.lmap); })
      .then(function () { leafletOk = true; iniciarMapa(); })
      .catch(function () {
        var w = $("cpmMpWrap"); if (w) w.classList.add("caido");
        /* Si el mapa no carga, la lista pasa a ser la vista por omision:
           dejar el bloque en "ver mapa" mostraria un rectangulo muerto. */
        raiz.classList.remove("ver-mapa"); raiz.classList.add("ver-lista");
        marcarVista();
        ajustarAlto();
      });
  }

  /* ===================== MONTAJE DE CONTROLES ===================== */
  function montar() {
    var lg = $("cpmMpLogo"); if (lg) lg.src = LOGO_W;
    capaAct = capaGuardada();
    pintarAtrib();

    /* Pastillas de tipo */
    var cont = $("cpmMpTipos");
    if (cont) {
      cont.innerHTML = TIPOS.map(function (c) {
        return '<button class="pill' + (c === tipoAct ? " on" : "") + '" type="button" data-t="' + esc(c) + '">' +
               esc(c) + ' <span class="n" data-n="' + esc(c) + '"></span></button>';
      }).join("");
      cont.addEventListener("click", function (ev) {
        var b = ev.target.closest ? ev.target.closest(".pill") : null;
        if (!b) return;
        tipoAct = b.getAttribute("data-t");
        cont.querySelectorAll(".pill").forEach(function (x) { x.classList.toggle("on", x === b); });
        limite = null;
        aplicar();
      });
    }

    /* Ciudades */
    var sel = $("cpmMpCiudad");
    if (sel) {
      var ciudades = {};
      DATOS.forEach(function (t) { if (t.ciudad) ciudades[String(t.ciudad).trim()] = 1; });
      var lista = Object.keys(ciudades).sort(function (a, b) { return a.localeCompare(b, "es"); });
      sel.innerHTML = '<option value="">Todas las ciudades</option>' +
        lista.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + "</option>"; }).join("");
      sel.addEventListener("change", function () { ciudadAct = sel.value; limite = null; aplicar(); });
    }
    var sp = $("cpmMpPrecio");
    if (sp) sp.addEventListener("change", function () { precioAct = sp.value; limite = null; aplicar(); });
    var ss = $("cpmMpSup");
    if (ss) ss.addEventListener("change", function () { supAct = ss.value; limite = null; aplicar(); });

    var bq = $("cpmMpBusca");
    if (bq) bq.addEventListener("input", function () { q = bq.value; limite = null; aplicar(); });

    var bl = $("cpmMpLimpiar");
    if (bl) bl.addEventListener("click", function () {
      q = ""; tipoAct = "Todos"; ciudadAct = ""; precioAct = ""; supAct = ""; limite = null;
      if (bq) bq.value = "";
      if (sel) sel.value = ""; if (sp) sp.value = ""; if (ss) ss.value = "";
      if (cont) cont.querySelectorAll(".pill").forEach(function (x) {
        x.classList.toggle("on", x.getAttribute("data-t") === "Todos");
      });
      aplicar();
      verTodo();
    });

    /* Vista lista / mapa (movil) */
    var vl = $("cpmMpVerLista"), vm = $("cpmMpVerMapa");
    if (vl) vl.addEventListener("click", function () {
      raiz.classList.add("ver-lista"); raiz.classList.remove("ver-mapa"); marcarVista();
    });
    if (vm) vm.addEventListener("click", function () {
      raiz.classList.add("ver-mapa"); raiz.classList.remove("ver-lista"); marcarVista();
      /* Leaflet mide el contenedor al crearse; si estaba oculto, midio 0. */
      if (mapa) setTimeout(function () { safe(function () { mapa.invalidateSize(); }); }, 60);
    });
    marcarVista();

    var ba = $("cpmMpAqui");
    if (ba) ba.addEventListener("click", buscarAqui);
    var bt = $("cpmMpTodo");

  /* ===================== FILTROS ===================== */
  function rango(txt) {
    if (!txt) return null;

  }
  function pasaTipo(t) {
    if (tipoAct === "Todos") return true;
    if (tipoAct === "Terrenos") return t.tipo === "Terreno Particular";
    if (tipoAct === "Macrolotes") return t.tipo === "Macrolote";
    return !!(t.categorias && t.categorias.indexOf(tipoAct) >= 0);
  }
  function cuenta(cat) {
    var g = tipoAct; tipoAct = cat;
    var n = DATOS.filter(pasaTipo).length;
    tipoAct = g;
    return n;
  }
  function baseFiltrada() {
    var rp = rango(precioAct), rs = rango(supAct);
    return DATOS.filter(function (t) {
      if (!pasaTipo(t)) return false;
      if (ciudadAct && String(t.ciudad || "").trim() !== ciudadAct) return false;
      if (rp) {
        var pr = precioDe(t);
        if (pr <= 0) return false;                       /* "a tratar" no entra en un rango */
        if (pr < rp.min) return false;
        if (rp.max > 0 && pr > rp.max) return false;
      }
      if (rs) {
        var sm = supM2(t);

    TIPOS.forEach(function (c) {
      var el = raiz.querySelector('.n[data-n="' + (window.CSS && CSS.escape ? CSS.escape(c) : c) + '"]');
      if (el) el.textContent = cuenta(c);

  function pintarPrecision() {

  /* ===================== LISTA ===================== */

  function pintarLista(res) {

  }

  /* ===================================================================

  /* ===================== MAPA ===================== */

      if (edicion && selId) fijarCoord(selId, ev.latlng.lat, ev.latlng.lng);

  }
  function proyecta(lat, lng) {

    var grupos = agrupar(conCoord.map(function (t) { return { t: t, coord: t.coord }; }), proyecta, 64);
    grupos.forEach(function (g) {
      if (g.grupo) {

          iconSize: null

  function resaltarPin(id, on) {

  /* ===================================================================

    anclar(ov);
    trabarSitio();
    return ov;
  }
  function cerrar(ov) {
    var i = anclados.indexOf(ov);
    if (i >= 0) anclados.splice(i, 1);
    if (ov && ov.parentNode) ov.parentNode.removeChild(ov);
    if (!document.querySelector(".cpm-mp-viva")) {
      destrabarSitio();
      salirPantallaCompleta();
    }
  }
  /* Escape cierra la capa de encima. */
  (function () {
    function alTeclado(ev) {
      if (ev.key !== "Escape" && ev.key !== "Esc") return;
      var todas = document.querySelectorAll(".cpm-mp-viva");
      if (todas.length) cerrar(todas[todas.length - 1]);
    }
    document.addEventListener("keydown", alTeclado);
    safe(function () { MARCO.win.document.addEventListener("keydown", alTeclado); });
  })();

  /* ===================== FICHA ===================== */
  function abrirFicha(id) {
    var t = propPorId(id);
    if (!t) return;
    seleccionar(id, true);
    var pr = precioDe(t), fotos = t.fotos || [];
    var ov = capa(2147483000);

    var datos = [["Superficie", fmtSup(t)], ["Ciudad", t.ciudad || "—"],
                 ["Estado", t.estado || "—"], ["Tipo", t.tipo || "—"]];
    if (Number(t.precio_m2) > 0) datos.push(["Precio por m²", fmt(t.precio_m2)]);
    if (t.coord) datos.push(["Ubicación", t.coord.precision === "exacta" ? "Exacta" : "Aproximada"]);
    var datosHTML = datos.map(function (p) {
      return '<div class="dato-caja"><span>' + esc(p[0]) + "</span><b>" + esc(p[1]) + "</b></div>";
    }).join("");

    var accs = "";
    if (t._premium && t._acciones) {
      accs = t._acciones.map(function (a) {
        return '<a class="cta cta-' + (a.estilo === "oro" ? "oro" : "navy") + '" href="' + esc(a.url) +
               '" target="_blank" rel="noopener">' + esc(a.txt) + "</a>";
      }).join("");
    }
    var msg = t._premium
      ? "Hola, me interesa Imperio Conkal. Quiero información de disponibilidad y precios."
      : "Hola, me interesa la propiedad " + (t.nombre || "") + " (" + t.id + ").";
    accs += '<a class="cta cta-wa" href="https://wa.me/' + WA + "?text=" + encodeURIComponent(msg) +
            '" target="_blank" rel="noopener">💬 Preguntar por WhatsApp</a>';
    if (t.ubicacion_maps && /^https?:/i.test(t.ubicacion_maps)) {
      accs += '<a class="cta cta-maps" href="' + esc(t.ubicacion_maps) +
              '" target="_blank" rel="noopener">🗺 Abrir en Google Maps</a>';
    }

    ov.innerHTML =
      '<div class="hoja" style="padding-bottom:26px">' +
        '<div class="hoja-top">' +
          '<span class="etq">' + esc(t.id) + "</span>" +
          '<button class="cerrar" id="cpmMpFx" type="button" aria-label="Cerrar">✕</button>' +
        "</div>" +
        (fotos.length
          ? '<div id="cpmMpFoto" style="margin:0 16px;border-radius:14px;overflow:hidden;height:210px;cursor:pointer;position:relative">' +
            '<img src="' + esc(fotos[0]) + '" style="width:100%;height:100%;object-fit:cover" alt="">' +
            (fotos.length > 1 ? '<span style="position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:20px;padding:3px 10px;font-size:11px">+' + (fotos.length - 1) + " fotos</span>" : "") +
            "</div>"
          : '<div style="margin:0 16px;border-radius:14px;height:120px;background:linear-gradient(135deg,#e8f2fb,#c5ddf5);display:flex;align-items:center;justify-content:center"><img src="' + LOGO_AZUL + '" style="height:46px;opacity:.5" alt="CPM"></div>') +
        '<div style="padding:16px 18px 0">' +
          "<h3>" + esc(t.nombre || t.id) + "</h3>" +
          '<div style="font-size:12.5px;color:#5a6a7a;margin:5px 0 14px">📍 ' + esc(t.ciudad || "") +
            (t.estado ? ", " + esc(t.estado) : "") + "</div>" +
          '<div style="background:linear-gradient(135deg,#1a2d42,#2d4a6e);border-radius:14px;padding:14px 18px;margin-bottom:14px">' +
            '<div style="font-size:9px;color:#7a9ab8;letter-spacing:.16em;text-transform:uppercase;margin-bottom:3px">' +
              (t._desde ? "Precio desde" : "Precio") + "</div>" +
            '<div style="font-size:21px;font-weight:700;color:#5a95cc">' + fmt(pr) + "</div>" +
          "</div>" +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px">' + datosHTML + "</div>" +
          (t.descripcion
            ? '<div class="etq" style="margin-bottom:6px">Descripción</div>' +
              '<p style="color:#3a4a5a;line-height:1.75;font-size:12.5px;margin-bottom:14px">' + esc(t.descripcion) + "</p>"
            : "") +
          accs +
        "</div></div>";

    ov.addEventListener("click", function (e) { if (e.target === ov) cerrar(ov); });
    var bx = ov.querySelector("#cpmMpFx");
    if (bx) bx.addEventListener("click", function () { cerrar(ov); });
    var bf = ov.querySelector("#cpmMpFoto");
    if (bf) bf.addEventListener("click", function () { abrirGaleria(fotos); });
  }

  /* ===================== GALERIA ===================== */
  function abrirGaleria(fotos) {
    if (!fotos || !fotos.length) return;
    var i = 0;
    var ov = capa(2147483200);
    ov.style.background = "rgba(0,0,0,.94)";
    ov.style.padding = "0";
    function pinta() {
      /* Sin unidades vh: dentro de un iframe 1vh es el 1% del marco entero
         (miles de px), no de la pantalla. Se usa el 100% de la capa, que ya
         viene con la altura de la banda visible. */
      ov.innerHTML =
        '<button id="cpmMpGx" class="cerrar" style="position:absolute;top:14px;right:14px;z-index:3;background:rgba(255,255,255,.2);color:#fff" type="button">✕</button>' +
        '<div style="width:100%;max-width:700px;height:100%;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px">' +
          '<img src="' + esc(fotos[i]) + '" style="max-width:100%;max-height:100%;min-height:0;object-fit:contain;border-radius:10px" alt="">' +
          (fotos.length > 1
            ? '<div style="display:flex;gap:7px;flex:0 0 auto">' + fotos.map(function (f, k) {
                return '<i data-k="' + k + '" style="width:9px;height:9px;border-radius:50%;background:' +
                  (k === i ? "#3d7ab5" : "rgba(255,255,255,.4)") + ';cursor:pointer;display:inline-block"></i>';
              }).join("") + "</div>"
            : "") +
        "</div>" +
        (fotos.length > 1
          ? '<button id="cpmMpGp" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.2);border:0;border-radius:50%;width:42px;height:42px;color:#fff;font-size:22px;cursor:pointer">‹</button>' +
            '<button id="cpmMpGn" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.2);border:0;border-radius:50%;width:42px;height:42px;color:#fff;font-size:22px;cursor:pointer">›</button>'
          : "");
      ov.querySelector("#cpmMpGx").addEventListener("click", function () { cerrar(ov); });
      if (fotos.length > 1) {
        ov.querySelector("#cpmMpGp").addEventListener("click", function () { i = (i - 1 + fotos.length) % fotos.length; pinta(); });
        ov.querySelector("#cpmMpGn").addEventListener("click", function () { i = (i + 1) % fotos.length; pinta(); });
        ov.querySelectorAll("i[data-k]").forEach(function (d) {
          d.addEventListener("click", function () { i = +d.getAttribute("data-k"); pinta(); });
        });
      }
    }
    pinta();
    ov.addEventListener("click", function (e) { if (e.target === ov) cerrar(ov); });
  }

  /* ===================================================================
     MODO EDICION
     Sirve para pasar una ubicacion de APROXIMADA a EXACTA sin tocar el
     portafolio de asesores: se elige la propiedad, se hace clic en el mapa
     y se guardan lat/lng en el documento de 'catalogo_publico'.
     Las reglas ya exigen sesion para escribir, asi que primero se entra.
     =================================================================== */
  function abrirEdicion() {
    if (edicion) { salirEdicion(); return; }
    var ov = capa(2147483300);
    ov.innerHTML =
      '<div class="hoja" style="max-width:400px;padding:24px 22px 26px">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px">' +
          "<h3>Modo edición</h3>" +
          '<button class="cerrar" id="cpmMpEx" type="button">✕</button></div>' +
        '<p style="font-size:12.5px;color:#5a6a7a;line-height:1.65;margin-bottom:16px">' +
          "Sirve para fijar la ubicación exacta de cada propiedad. Entra con tu cuenta de CPM, " +
          "elige una propiedad en la lista y haz clic en el mapa sobre el predio.</p>" +
        '<label class="lbl">Correo</label>' +
        '<input id="cpmMpMail" class="inp" type="email" autocomplete="username">' +
        '<div style="height:12px"></div>' +
        '<label class="lbl">Contraseña</label>' +
        '<input id="cpmMpPass" class="inp" type="password" autocomplete="current-password">' +
        '<div id="cpmMpEerr"></div>' +
        '<button id="cpmMpEok" class="cta cta-maps" style="margin-top:16px" type="button">ENTRAR</button>' +
      "</div>";
    var bx = ov.querySelector("#cpmMpEx");
    bx.addEventListener("click", function () { cerrar(ov); });
    ov.addEventListener("click", function (e) { if (e.target === ov) cerrar(ov); });
    function err(m) { ov.querySelector("#cpmMpEerr").innerHTML = '<div class="err">' + esc(m) + "</div>"; }
    ov.querySelector("#cpmMpEok").addEventListener("click", function () {
      var mail = ov.querySelector("#cpmMpMail").value.trim();
      var pass = ov.querySelector("#cpmMpPass").value;
      if (!mail || !pass) return err("Escribe correo y contraseña.");
      var b = ov.querySelector("#cpmMpEok");
      b.textContent = "Entrando…";
      cargar(CDN.auth)
        .then(function () { return firebase.auth().signInWithEmailAndPassword(mail, pass); })
        .then(function (cred) {
          usuarioEd = cred.user;
          edicion = true;
          cerrar(ov);
          entrarEdicion();
        })
        .catch(function (e) {
          b.textContent = "ENTRAR";
          err(e && e.code === "auth/wrong-password" ? "Contraseña incorrecta." :
              (e && e.code === "auth/user-not-found" ? "Ese correo no tiene cuenta." :
               "No se pudo entrar: " + ((e && (e.code || e.message)) || "error")));
        });
    });
  }
  function entrarEdicionBanner(el) {
    el.innerHTML =
      '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">' +
        '<span style="flex:1 1 220px;min-width:0"><b>Modo edición.</b> ' +
        'Haz clic en el mapa, o pega las coordenadas o el Plus Code. ' +
        '<span id="cpmMpEdSel" style="color:#8fb8dd"></span></span>' +
        '<input id="cpmMpEdTxt" placeholder="21.0672, -89.5046  ·  3F8W+V5" ' +
          'style="flex:0 1 250px;min-width:0;padding:7px 10px;border:0;border-radius:8px;' +
          'font:inherit;font-size:12px;color:#1e2d3d;background:#fff">' +
        '<button id="cpmMpEdFijar" style="background:#3d7ab5;color:#fff;border:0;border-radius:8px;' +
          'padding:8px 14px;font:inherit;font-size:12px;font-weight:700;cursor:pointer">Fijar</button>' +
      "</div>";
    var caja = $("cpmMpEdTxt"), bot = $("cpmMpEdFijar");
    if (bot) bot.addEventListener("click", function () { fijarDesdeTexto(); });
    if (caja) caja.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") { ev.preventDefault(); fijarDesdeTexto(); }
    });
  }
  function entrarEdicion() {
    var be = $("cpmMpEditar");
    if (be) be.textContent = "Salir de edición";
    var el = document.createElement("div");
    el.id = "cpmMpEdBanner";
    el.style.cssText = "position:absolute;bottom:12px;left:12px;right:12px;z-index:600;background:#1a2d42;" +
      "color:#fff;border-radius:11px;padding:10px 13px;font-size:12px;line-height:1.5;box-shadow:0 4px 16px rgba(0,0,0,.3)";
    var w = $("cpmMpWrap");
    if (w) w.appendChild(el);
    entrarEdicionBanner(el);
    aplicar();
    refrescarBannerEd();
  }
  function salirEdicion() {
    edicion = false;
    usuarioEd = null;
    safe(function () { firebase.auth().signOut(); });
    var be = $("cpmMpEditar");
    if (be) be.textContent = "Modo edición";
    var b = $("cpmMpEdBanner");
    if (b && b.parentNode) b.parentNode.removeChild(b);
    aplicar();
  }
  function refrescarBannerEd() {
    var s = $("cpmMpEdSel");
    if (!s) return;
    var t = selId ? propPorId(selId) : null;
    s.textContent = t ? "Seleccionada: " + (t.nombre || t.id) : "Ninguna seleccionada.";
  }
  /* Acepta las dos formas en que se puede copiar una ubicacion de Google
     Maps: el par "lat, lng" (clic derecho en el ordenador) y el Plus Code
     (lo que se ve en el telefono, debajo del nombre del sitio). */
  function fijarDesdeTexto() {
    var caja = $("cpmMpEdTxt");
    if (!caja) return;
    var txt = String(caja.value || "").trim();
    if (!txt) { avisoEd("Pega las coordenadas o el Plus Code."); return; }
    if (!selId) { avisoEd("Elige primero una propiedad en la lista."); return; }
    var t = propPorId(selId);
    var base = t ? coordsDeLocalidad(t.ciudad, t.estado) : null;

    /* Primero el par de numeros: es lo mas explicito y no se confunde. */
    var m = txt.match(/(-?\d{1,3}(?:\.\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)/);
    var v = m ? valida(m[1], m[2]) : null;
    var comoQue = "coordenadas";
    if (!v) {
      var pv = plusEnTexto(txt, base ? base[0] : null, base ? base[1] : null);
      if (pv) { v = pv; comoQue = "Plus Code"; }
    }
    if (!v) {
      avisoEd(/\+/.test(txt) && !base
        ? "Ese Plus Code es corto y la ciudad de la propiedad no está en el listado de localidades: pega el código completo o las coordenadas."
        : "No se reconoce. Usa \"21.0672, -89.5046\" o un Plus Code como \"3F8W+V5\".");
      return;
    }
    caja.value = "";
    fijarCoord(selId, v[0], v[1], comoQue);
  }

  function fijarCoord(id, lat, lng, comoQue) {
    var t = propPorId(id);
    if (!t) return;
    if (String(id).toUpperCase().indexOf("IMPERIO") === 0) {
      avisoEd("Imperio Conkal no vive en la base de datos: su ubicación se cambia en el código.");
      return;
    }
    firebase.firestore().collection(COL).doc(String(id))
      .set({ lat: Number(lat.toFixed(6)), lng: Number(lng.toFixed(6)) }, { merge: true })
      .then(function () {
        t.lat = Number(lat.toFixed(6)); t.lng = Number(lng.toFixed(6));
        t.coord = { lat: t.lat, lng: t.lng, precision: "exacta", fuente: "campo" };
        aplicar();
        avisoEd("Ubicación guardada para " + (t.nombre || t.id) +
                (comoQue ? " (por " + comoQue + ")." : "."));
      })
      .catch(function (e) {
        avisoEd("No se pudo guardar: " + ((e && (e.code || e.message)) || "error"));
      });
  }
  function avisoEd(msg) {
    var b = $("cpmMpEdBanner");
    if (!b) { safe(function () { window.alert(msg); }); return; }
    b.innerHTML = "<b>" + esc(msg) + "</b>";
    setTimeout(function () {
      if (!edicion) return;
      entrarEdicionBanner(b);
      refrescarBannerEd();
    }, 2600);
  }

  /* ===================================================================
     CONTENEDOR DE HOSTINGER
     El bloque tiene altura fija, asi que aqui solo hay que quitar los
     recortes de los contenedores padre y decirle al marco cuanto mide.
     No hay altura reservada que colapsar: siempre mide lo mismo.
     =================================================================== */
  function liberar() {
    /* Se parte de frameElement, NO de raiz.parentElement: raiz vive DENTRO
       del iframe y sus padres son el <body> del propio marco, no los
       contenedores del sitio. Partiendo de raiz no se toca nada y el marco
       acaba desbordando su hueco -- medido: iframe 1016px dentro de una
       fila de 700px. */
    if (!MARCO.el) return;
    var el = MARCO.el.parentElement, n = 0;
    while (el && el.tagName !== "BODY" && n < 8) {
      var s = el.style, cl = " " + (el.className || "") + " ";
      s.setProperty("height", "auto", "important");
      s.setProperty("min-height", "0", "important");
      s.setProperty("max-height", "none", "important");
      s.overflow = "visible";
      var rejilla = false;
      safe(function () { rejilla = getComputedStyle(el).display.indexOf("grid") >= 0; });
      if (rejilla || cl.indexOf(" block-layout ") >= 0) s.setProperty("grid-template-rows", "auto", "important");
      el = el.parentElement; n++;
    }
  }
  /* --alto se MIDE, no se adivina. La barra, los filtros y el pie cambian de
     altura segun el ancho -- en movil los filtros se reparten en tres filas
     en vez de dos --, y con un descuento fijo el bloque salia 100px mas alto
     que la pantalla del telefono. Aqui se restan las tres piezas medidas. */
  function ventanaReal() {
    var h = 0;
    safe(function () { h = (MARCO.win && MARCO.win.innerHeight) || window.innerHeight; });
    return h || window.innerHeight || 800;
  }
  function medirAlto() {
    var vh = ventanaReal(), usado = 0;
    [".barra", ".filtros", ".pie"].forEach(function (sel) {
      var e = raiz.querySelector(sel);
      if (e) usado += e.getBoundingClientRect().height;
    });
    var alto = Math.round(vh - usado - 26);
    var min = vh < 700 ? 300 : 400;
    if (alto < min) alto = min;
    if (alto > 720) alto = 720;
    raiz.style.setProperty("--alto", alto + "px");
  }

  var ultimoAlto = 0;
  function ajustarAlto() {
    /* Con el marco a pantalla completa no se toca su alto: al cerrar se
       restaura el estilo guardado y esto se vuelve a llamar. */
    if (pantalla) return;
    liberar();
    medirAlto();
    if (!MARCO.el) return;
    var alto = Math.ceil(raiz.getBoundingClientRect().height);
    if (!alto || Math.abs(alto - ultimoAlto) < 6) return;
    ultimoAlto = alto;
    safe(function () { MARCO.el.style.setProperty("height", alto + "px", "important"); });
    safe(function () { window.parent.postMessage({ type: "cpm-mapa:height", height: alto }, "*"); });
  }

  raiz.setAttribute("data-init", "listo");
  ajustarAlto();
  window.addEventListener("load", ajustarAlto);
  window.addEventListener("resize", function () {
    ajustarAlto();
    if (mapa) safe(function () { mapa.invalidateSize(); });
  }, { passive: true });
  /* La ventana del padre es la que manda cuando estamos dentro del marco */
  if (MARCO.win) safe(function () {
    MARCO.win.addEventListener("resize", function () {
      ajustarAlto();
      if (mapa) safe(function () { mapa.invalidateSize(); });
    }, { passive: true });
  });
  [300, 900, 1800, 3000].forEach(function (ms) { setTimeout(ajustarAlto, ms); });

  /* Ventana de pruebas: las funciones puras se comprueban desde fuera sin
     necesidad de red ni de mapa. */
  window.__cpmMapa = {
    coordsDeCampos: coordsDeCampos, coordsDeUrl: coordsDeUrl,
    coordsDeLocalidad: coordsDeLocalidad, dispersa: dispersa, resolver: resolver,
    norm: norm, buscar: buscar, agrupar: agrupar, fmtCorto: fmtCorto,
    olcCodifica: olcCodifica, olcDecodifica: olcDecodifica, olcRecupera: olcRecupera,
    plusEnTexto: plusEnTexto,
    supM2: supM2, precioDe: precioDe, valida: valida,
    ponerCapa: function (k) { ponerCapa(k); }, otraCapa: otraCapa, CAPAS: CAPAS,
    estado: function () { return { datos: DATOS.length, vista: VISTA.length, sel: selId, limite: limite, leaflet: leafletOk, capa: capaAct }; }
  };
})();
</script>
